version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gatekeeper_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gatekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatekeeper_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gatekeeper_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gatekeeper}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: gatekeeper_postgres_data
